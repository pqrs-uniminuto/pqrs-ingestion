version: '3.8'

services:
  # ============================================================================
  # 1. Base de Datos PostgreSQL (DWH)
  # ============================================================================
  pqrs-db:
    image: postgres:15-alpine
    container_name: ${POSTGRES_HOST:-pqrs_postgres_dwh}
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pqrs_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      # Mapea el puerto 5438 del host al puerto 5432 interno del contenedor
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pqrs_red_compartida

  # ============================================================================
  # 2. Servicio de Ingesta (FastAPI + Jinja2 UI)
  # ============================================================================
  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqrs_ingestion_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${INGESTION_API_PORT:-8000}:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - pqrs-db
    networks:
      - pqrs_red_compartida

  # ============================================================================
  # 3. Orquestador Dagster (Webserver / UI)
  # ============================================================================
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqrs_dagster_webserver
    restart: always
    command: dagster-webserver -h 0.0.0.0 -p 3000
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - pqrs-db
    networks:
      - pqrs_red_compartida

# ==============================================================================
# Volúmenes y Redes
# ==============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  pqrs_red_compartida:
    external: true